<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2B705">
<title>Obra da Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Manrope:wght@400..800&display=swap">
<style>
/* Layout: "aço e bronze" — painel escuro com emblema de elmo (guerreiro) e o resumo de valores;
   abaixo, ordens de serviço em cartões centralizados (máx. 1080px), que viram 2 colunas de campos no celular. */
:root {
  --bg: #EDEFF3;
  --surface: #FFFFFF;
  --surface-2: #F4F5F8;
  --ink: #131824;
  --muted: #5D6577;
  --line: #E0E3EA;
  --accent: #A97A24;          /* bronze */
  --accent-soft: #F5ECDB;
  --accent-ink: #FFFFFF;
  --hero: #151B27;            /* aço */
  --hero-2: #1F2736;
  --hero-ink: #F2F4F8;
  --hero-muted: #A3ACBD;
  --hero-accent: #D8A94C;
  --primary: #131824; --primary-ink: #FFFFFF;
  --link: #131824;
  --ok: #1B7A47; --ok-bg: #E2F3E8;
  --wait: #8A5A00; --wait-bg: #FBEFD3;
  --no: #B3322B; --no-bg: #FBE2E0;
  --rec: #D6372C;
  --scrim: rgb(10 14 22 / .5);
  --shadow-sm: 0 1px 2px rgb(19 24 36 / .06);
  --shadow: 0 1px 2px rgb(19 24 36 / .05), 0 8px 24px rgb(19 24 36 / .07);
  --shadow-lg: 0 24px 60px rgb(10 14 22 / .22);
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 16px; --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0F15; --surface: #151A23; --surface-2: #1B212C; --ink: #E8EBF1; --muted: #98A1B2; --line: #262D39;
    --accent: #D8A94C; --accent-soft: #2E2615; --accent-ink: #141414;
    --hero: #121722; --hero-2: #1A2130; --hero-ink: #EEF1F6; --hero-muted: #9AA3B5; --hero-accent: #E2B55A;
    --primary: #E8EBF1; --primary-ink: #11151D; --link: #E8EBF1;
    --ok: #6FD39C; --ok-bg: #14301F; --wait: #F0C46A; --wait-bg: #352A10; --no: #F48C83; --no-bg: #3A1A18;
    --rec: #FF5D52; --scrim: rgb(0 0 0 / .62);
    --shadow-sm: 0 1px 2px rgb(0 0 0 / .3); --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .3); --shadow-lg: 0 24px 60px rgb(0 0 0 / .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0F15; --surface: #151A23; --surface-2: #1B212C; --ink: #E8EBF1; --muted: #98A1B2; --line: #262D39;
  --accent: #D8A94C; --accent-soft: #2E2615; --accent-ink: #141414;
  --hero: #121722; --hero-2: #1A2130; --hero-ink: #EEF1F6; --hero-muted: #9AA3B5; --hero-accent: #E2B55A;
  --primary: #E8EBF1; --primary-ink: #11151D; --link: #E8EBF1;
  --ok: #6FD39C; --ok-bg: #14301F; --wait: #F0C46A; --wait-bg: #352A10; --no: #F48C83; --no-bg: #3A1A18;
  --rec: #FF5D52; --scrim: rgb(0 0 0 / .62);
  --shadow-sm: 0 1px 2px rgb(0 0 0 / .3); --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .3); --shadow-lg: 0 24px 60px rgb(0 0 0 / .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding-inline: 16px; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spacer { flex: 1; }

/* ---------- Topo ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--hero) 92%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); color: var(--hero-ink); border-bottom: 1px solid color-mix(in srgb, var(--hero-accent) 30%, transparent); }
.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.emblem { width: 40px; height: 40px; flex: none; }
.emblem, .hero-mark, .empty svg.big, .foot svg { --emb-ink: #151B27; }
.hero-mark { filter: grayscale(1); }
.brand-txt { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.brand h1 { margin: 0; font-family: var(--display); font-size: 17px; font-weight: 800; font-stretch: 118%; letter-spacing: .06em; text-transform: uppercase; line-height: 1.1; white-space: nowrap; }
.brand span { color: var(--hero-muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.saving { font-size: 12px; color: var(--hero-muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: transparent; }
.btn.primary:hover { background: color-mix(in srgb, var(--primary) 88%, var(--accent)); }
.btn.bronze { background: var(--hero-accent); color: #16130D; border-color: transparent; }
.btn.bronze:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--no); }
.btn.small { padding: 6px 11px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.rec-on { background: var(--rec); color: #fff; border-color: transparent; }
.btn.mic { border-color: var(--ink); }
.top .btn.owner { background: transparent; color: var(--hero-ink); border-color: color-mix(in srgb, var(--hero-ink) 25%, transparent); }
.top .btn.owner:hover { background: color-mix(in srgb, var(--hero-ink) 8%, transparent); }
.top .btn.owner.on { color: var(--hero-accent); border-color: color-mix(in srgb, var(--hero-accent) 55%, transparent); }
@media (max-width: 560px) {
  .brand span { display: none; }
  .brand h1 { font-size: 15px; font-stretch: 108%; letter-spacing: .04em; }
  .emblem { width: 36px; height: 36px; }
  .btn-label-long, .own-txt { display: none; }
  .top .btn { padding: 8px 12px; }
}

.how { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; box-shadow: var(--shadow-sm); }
.how-head { margin: 0; padding: 2px 4px 10px; font-family: var(--display); font-size: 16px; font-weight: 800; }
.how-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.how-steps button { width: 100%; height: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px; transition: border-color .15s, background .15s; }
.how-steps button:hover { border-color: var(--accent); background: var(--accent-soft); }
.how-n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: var(--primary-ink); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.how-ic { flex: none; color: var(--accent); display: grid; }
.how-ic svg.i { width: 22px; height: 22px; }
.how-t { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.how-t b { font-size: 15px; }
.how-t small { color: var(--muted); font-size: 12.5px; }
@media (max-width: 760px) { .how-steps { grid-template-columns: minmax(0, 1fr); gap: 6px; } .how-steps button { padding: 10px 12px; } }
.demo { background: var(--wait-bg); color: var(--wait); font-size: 13px; }
.demo .wrap { padding-block: 8px; }

/* ---------- Painel (hero) ---------- */
.hero { position: relative; overflow: hidden; margin-top: 18px; border-radius: 22px; background: radial-gradient(120% 140% at 100% 0%, var(--hero-2) 0%, var(--hero) 60%); color: var(--hero-ink); padding: 22px 22px 18px; box-shadow: var(--shadow); isolation: isolate; }
.hero-mark { position: absolute; right: -40px; bottom: -60px; width: 250px; height: 250px; opacity: .07; z-index: -1; pointer-events: none; }
.hero-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hero-sub { margin: 4px 0 0; color: var(--hero-muted); font-size: 14px; max-width: 48ch; }
.hero h2 { margin: 2px 0 0; font-family: var(--display); font-weight: 800; font-stretch: 110%; font-size: clamp(22px, 4.2vw, 30px); line-height: 1.1; text-wrap: balance; }
.hero-total { text-align: right; }
.hero-total b { display: block; font-family: var(--display); font-size: clamp(26px, 5vw, 36px); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.05; }
.hero-total span { font-size: 12.5px; color: var(--hero-muted); }
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
@media (max-width: 860px) { .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: color-mix(in srgb, var(--hero-ink) 6%, transparent); border: 1px solid color-mix(in srgb, var(--hero-ink) 10%, transparent); border-radius: 14px; padding: 11px 13px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi b { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi span { font-size: 11.5px; color: var(--hero-muted); letter-spacing: .03em; display: flex; align-items: center; gap: 6px; }
.kpi span i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.kpi.ok i { background: #4FC584; } .kpi.wait i { background: #EDB848; } .kpi.cob i { background: #8FB2E8; } .kpi.dif i { background: var(--hero-accent); }
.kpi.dif b { color: var(--hero-accent); }
@media (max-width: 560px) {
  .hero { padding: 18px 16px 14px; border-radius: 18px; }
  .hero-total { text-align: left; }
  .hero-sub { display: none; }
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
  .kpi { padding: 9px 11px; border-radius: 12px; }
  .kpi b { font-size: 15.5px; }
  .kpi span { font-size: 12px; }
}

/* ---------- Abas e filtros ---------- */
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-block: 18px 12px; }
.tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; box-shadow: var(--shadow-sm); }
.tabs button { border: 0; background: transparent; padding: 7px 15px; border-radius: 999px; font-weight: 700; display: inline-flex; gap: 7px; align-items: center; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.chip .num { opacity: .7; margin-left: 2px; }
.chip[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--ink); }
@media (max-width: 560px) {
  .bar { flex-direction: column; align-items: stretch; }
  .tabs { width: 100%; } .tabs button { flex: 1; justify-content: center; padding: 8px 6px; font-size: 14px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; }
}

/* ---------- Status ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 700; white-space: nowrap; border: 0; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-aprovado { background: var(--ok-bg); color: var(--ok); }
.s-aguardando { background: var(--wait-bg); color: var(--wait); }
.s-nao_aprovado { background: var(--no-bg); color: var(--no); }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.seg button.on.s-aprovado { background: var(--ok-bg); color: var(--ok); }
.seg button.on.s-aguardando { background: var(--wait-bg); color: var(--wait); }
.seg button.on.s-nao_aprovado { background: var(--no-bg); color: var(--no); }
.seg button:not(.on) { background: transparent; }

/* ---------- Cartões de serviço ---------- */
.list { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-sm); padding: 16px; display: grid; gap: 14px; min-width: 0; transition: box-shadow .2s, border-color .2s; }
.card:hover { box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--accent) 25%, var(--line)); }
.card-top { display: flex; gap: 14px; align-items: flex-start; min-width: 0; }
.svc { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 3px 14px; text-align: left; border: 0; background: transparent; padding: 0; align-items: start; flex: 1; min-width: 0; }
.svc > :not(.thumb) { grid-column: 2; }
.thumb { grid-row: 1 / span 4; width: 64px; height: 64px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.os { font-size: 11.5px; color: var(--accent); font-weight: 800; letter-spacing: .1em; font-variant-numeric: tabular-nums; }
.ttl { font-family: var(--display); font-stretch: 100%; font-weight: 700; font-size: 17px; line-height: 1.25; color: var(--link); text-wrap: balance; }
.svc:hover .ttl { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.desc { color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.flags { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; margin-top: 2px; }
.flags span { display: inline-flex; align-items: center; gap: 4px; }
.flags svg.i { width: 14px; height: 14px; }
.flags .ready { color: var(--accent); font-weight: 700; }
.card-status { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.by { font-size: 12.5px; color: var(--muted); }
.by b { color: var(--ink); font-weight: 700; }
.s-aprovado-txt b { color: var(--ok); } .s-nao_aprovado-txt b { color: var(--no); }
.fields { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); align-items: start; }
.fields > .cell { grid-column: span 2; }
.dif-cell { background: var(--ok-bg); border-radius: var(--r-sm); padding: 7px 12px; align-self: stretch; justify-content: center; }
.dif-cell .lbl { color: var(--ok); }
.dif { font-family: var(--display); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.2; color: var(--ok); }
.dif.zero { color: var(--muted); font-family: var(--font); font-weight: 600; font-size: 13.5px; }
.dif.neg { color: var(--no); }
.fields .calc { padding: 4px 0 0; }
.cell { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.lbl { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.opt { font-weight: 400; opacity: .75; }
.in { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-sm); padding: 9px 11px; font-variant-numeric: tabular-nums; transition: border-color .15s, background .15s; }
.in:hover { border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
.in:focus { background: var(--surface); border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.in::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }
.money-in, .money .in { text-align: right; }
.calc { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; padding: 9px 0; line-height: 1.2; }
.calc small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
.total-cell { background: var(--accent-soft); border-radius: var(--r-sm); padding: 7px 12px; align-self: stretch; justify-content: center; }
.total-cell .lbl { color: var(--accent); }
.total { font-family: var(--display); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.total.zero { color: var(--muted); font-family: var(--font); font-weight: 600; font-size: 13.5px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 44px 20px; text-align: center; color: var(--muted); display: grid; justify-items: center; gap: 6px; }
.empty svg.big { width: 72px; height: 72px; margin-bottom: 6px; }
.empty b { color: var(--ink); font-size: 17px; font-family: var(--display); }
.empty p { margin: 0; max-width: 46ch; }
@media (max-width: 860px) {
  .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fields > .cell { grid-column: span 1; }
  .fields > .total-cell { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; }
  .fields > .dif-cell { flex-direction: column; justify-content: center; }
}
@media (max-width: 560px) {
  .card { padding: 14px; gap: 12px; }
  .card-top { flex-direction: column; gap: 12px; }
  .card-status { align-items: stretch; }
  .card-status, .card-status .seg { width: 100%; }
  .card-status .seg button { flex: 1; }
  .svc { grid-template-columns: 56px minmax(0, 1fr); gap: 2px 12px; }
  .thumb { width: 56px; height: 56px; }
  .ttl { font-size: 16px; }
}

/* ---------- Calendário ---------- */
.cal { --lane: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow-sm); }
.cal-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.cal-head h2 { margin: 0 auto 0 2px; font-family: var(--display); font-size: 19px; font-weight: 800; font-stretch: 105%; }
.dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.dow span { padding: 7px 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 3px; border-bottom: 1px solid var(--line); position: relative; }
.week::after { content: ""; grid-column: 1 / -1; height: 6px; }
.week:last-child { border-bottom: 0; }
.day { border-left: 1px solid var(--line); padding: 6px 8px; font-size: 12.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.day:first-child { border-left: 0; }
.day.out { background: var(--surface-2); color: color-mix(in srgb, var(--muted) 55%, transparent); }
.day.today span { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 7px; }
.ev { z-index: 1; margin: 0 4px; border: 0; border-radius: 6px; padding: 0 8px; font-size: 12px; font-weight: 700; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: var(--lane); min-width: 0; }
.ev.cl { margin-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.ev.cr { margin-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; }
.ev:hover { filter: brightness(.96); }
.log { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow-sm); }
.log-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-bottom: 10px; }
.log-head h2 { margin: 0; font-family: var(--display); font-size: 18px; font-weight: 800; }
.log-list li { flex-wrap: wrap; row-gap: 2px; }
.log-os { flex-basis: 100%; margin-left: 19px; border: 0; background: none; padding: 0; text-align: left; color: var(--muted); font-size: 13px; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; }
.log-os:hover { color: var(--ink); }
.nodate { margin-top: 16px; }
.nodate h3, .sec h3 { font-family: var(--display); font-size: 16px; color: var(--ink); margin: 0 0 8px; font-weight: 800; }

  set: function (k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
};
var BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
var NUM = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function num(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  var s = String(v == null ? '' : v).replace(/[^\d,.\-]/g, '');
  if (s.indexOf(',') !== -1) s = s.replace(/\./g, '').replace(',', '.');
  var n = parseFloat(s);
  return isFinite(n) ? Math.round(n * 100) / 100 : 0;
}
function money(n) { return BRL.format(num(n)); }
function moneyIn(n) { n = num(n); return n ? NUM.format(n) : ''; }
function cobradoIn(v) { return (v === '' || v == null) ? '' : NUM.format(num(v)); }
function difHTML(it) { return it.temCobrado ? money(it.diferenca) : '—'; }
function pd(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return null; var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dm(s) { var d = pd(s); return d ? d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) : '—'; }
function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function osNum(n) { return 'OS ' + String(n || 0).padStart(3, '0'); }
function mmss(s) { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function uid() { return Math.random().toString(36).slice(2, 8); }
var STATUS = { aguardando: 'Aguardando', aprovado: 'Aprovado', nao_aprovado: 'Não aprovado' };
var ICON = {
  cam: '<svg class="i" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  mic: '<svg class="i" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4M8 22h8"/></svg>',
  stop: '<svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',

/* ===================== Estado ===================== */
var state = {
  items: [], hasClaude: false, hasTranscription: false, autoSuggest: true, loaded: false,
  view: LS.get('obra.view') || 'lista', filter: 'todos',
  openId: null, pin: LS.get('obra.pin'), month: new Date(),
  confirmSug: false, confirmDel: false, sugBusy: {}, sugErr: {},
  draft: null, rec: null, modal: null, pending: 0, dirty: false, audioCache: {}
};
state.month.setDate(1);

function itemById(id) { for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i]; return null; }
function computeTotals(it) {
  var priced = (it.materiais || []).filter(function (m) { return m.usar && num(m.valor) > 0; });
  it.materialFromList = priced.length > 0;
  it.materialTotal = priced.length ? priced.reduce(function (s, m) { return s + num(m.valor); }, 0) : num(it.materialManual);
  it.total = num(it.maoDeObra) + it.materialTotal;
  it.temCobrado = it.valorCobrado !== '' && it.valorCobrado != null;
  it.diferenca = it.temCobrado ? Math.round((it.total - num(it.valorCobrado)) * 100) / 100 : 0;
  return it;
}
function setItem(it) {
  computeTotals(it);
  var i = state.items.findIndex(function (x) { return x.id === it.id; });
  if (i === -1) state.items.push(it); else state.items[i] = it;
  state.items.sort(function (a, b) { return a.numero - b.numero; });
}

/* ===================== Servidor ===================== */
var MODE = (window.google && google.script && google.script.run) ? 'gas' : (CONFIG.API_URL ? 'http' : 'demo');
function call(action) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (MODE === 'gas') return new Promise(function (res, rej) {
    google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(new Error(e && e.message || String(e))); }).api(action, args);
  });
  if (MODE === 'http') return fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, args: args }) })
    .then(function (r) { return r.json(); }).then(function (j) { if (!j.ok) throw new Error(j.error); return j.data; });
  return Demo.call(action, args);
}
function tracked(p) {
  state.pending++; showSaving();
  return p.then(function (v) { state.pending--; showSaving(true); return v; }, function (e) { state.pending--; showSaving(); toast(e.message || 'Algo deu errado. Tente de novo.'); throw e; });
}
var savedTimer;
function showSaving(done) {
  var el = $('#saving');
  clearTimeout(savedTimer);
  if (state.pending > 0) el.textContent = 'Salvando…';
  else if (done) { el.textContent = 'Salvo'; savedTimer = setTimeout(function () { el.textContent = ''; }, 1600); }
  else el.textContent = '';
}
function photoSrc(f) { return f.url || ('https://drive.google.com/thumbnail?id=' + encodeURIComponent(f.id) + '&sz=w1200'); }

function applyConfig(d) {
  state.hasClaude = !!d.hasClaude; state.hasTranscription = !!d.hasTranscription; state.autoSuggest = d.autoSuggest !== false;
  // Os botões mostram os papéis (Proprietário/Prestador); os nomes do servidor ficam só para os e-mails.
}
function actor() { return eu() || LS.get('obra.who') || CONFIG.PRESTADOR; }
function load() {
  return call('list').then(function (d) {
    applyConfig(d);
    state.items = []; (d.items || []).forEach(setItem);
    state.loaded = true;
    var m = /^#os-([\w-]+)$/.exec(location.hash || '');
    if (m && itemById(m[1])) state.openId = m[1];
    render();
  }).catch(function (e) { state.loaded = true; render(); toast('Não consegui carregar: ' + e.message); });
}

/* ===================== Render ===================== */
function editing() {
  var a = document.activeElement;
  return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox' && a.type !== 'file';
}
function render() {
  if (editing()) { state.dirty = true; updateCalcs(); return; }
  state.dirty = false;
  $('#demoBar').hidden = MODE !== 'demo';
  renderOwner(); renderSummary(); renderFilters();
  $('#tabLista').setAttribute('aria-pressed', state.view === 'lista');
  $('#tabCal').setAttribute('aria-pressed', state.view === 'calendario');
  $('#tabLog').setAttribute('aria-pressed', state.view === 'registro');
  $('#content').innerHTML = state.view === 'lista' ? listHTML() : state.view === 'registro' ? logHTML() : calHTML();
  renderLayer();
}
document.addEventListener('focusout', function () {
  setTimeout(function () { if (state.dirty && !editing()) render(); }, 0);
});

function eu() { return LS.get('obra.eu') || ''; }
function renderOwner() {
  var b = $('#ownerBtn'), n = eu();
  b.className = 'btn owner' + (n ? ' on' : '');
  b.innerHTML = '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span class="own-txt">' + (n ? esc(n) : 'Quem é você?') + '</span>';
  b.setAttribute('aria-label', n ? 'Você está como ' + n + '. Toque para trocar.' : 'Informe seu nome');
  b.title = n ? 'As aprovações deste aparelho ficam registradas em nome de ' + n + '. Toque para trocar.' : 'Informe seu nome para registrar aprovações';
}

function renderSummary() {
  var t = { aprovado: 0, aguardando: 0, nao_aprovado: 0 }, n = { aprovado: 0, aguardando: 0, nao_aprovado: 0 }, cob = 0, dif = 0;
  state.items.forEach(function (it) {
    t[it.status] = (t[it.status] || 0) + it.total; n[it.status] = (n[it.status] || 0) + 1;
    if (it.status !== 'nao_aprovado' && it.temCobrado) { cob += num(it.valorCobrado); dif += it.diferenca; }
  });
  $('#heroTotal').textContent = money(t.aprovado + t.aguardando);
  $('#summary').innerHTML =
    kpi('ok', money(t.aprovado), 'Aprovado · ' + n.aprovado) +
    kpi('wait', money(t.aguardando), 'Aguardando · ' + n.aguardando) +
    kpi('cob', money(cob), 'Total cobrado') +
    kpi('dif', money(dif), 'Total da diferença');
  function kpi(c, v, l) { return '<div class="kpi ' + c + '"><b>' + esc(v) + '</b><span><i></i>' + esc(l) + '</span></div>'; }
}

function renderFilters() {
  var el = $('#filters');
  if (state.view !== 'lista') { el.innerHTML = ''; return; }
  var c = { todos: state.items.length, aguardando: 0, aprovado: 0, nao_aprovado: 0 };
  state.items.forEach(function (it) { c[it.status]++; });
  el.innerHTML = [['todos', 'Todos'], ['aguardando', 'Aguardando'], ['aprovado', 'Aprovados'], ['nao_aprovado', 'Não aprovados']].map(function (f) {
    return '<button class="chip" data-act="filter" data-filter="' + f[0] + '" aria-pressed="' + (state.filter === f[0]) + '">' + f[1] + ' <span class="num">' + c[f[0]] + '</span></button>';
  }).join('');
}

function statusControl(it) {
  return '<div class="seg" role="group" aria-label="Aprovação">' + ['aprovado', 'aguardando', 'nao_aprovado'].map(function (s) {
    return '<button class="s-' + s + (it.status === s ? ' on' : '') + '" data-act="status" data-id="' + it.id + '" data-status="' + s + '" aria-pressed="' + (it.status === s) + '">' + STATUS[s] + '</button>';
  }).join('') + '</div>';
}
var ACAO = { aprovado: 'Aprovado', nao_aprovado: 'Não aprovado', aguardando: 'Voltou para aguardando' };
function quando(isoStr) {
  var d = new Date(isoStr); if (isNaN(d)) return '';
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function ultimoStatus(it) {
  var h = (it.historico || []).filter(function (e) { return e.tipo === 'status'; });
  return h.length ? h[h.length - 1] : null;
}
function quemAprovou(it) {
  var e = ultimoStatus(it);
  if (!e || e.para !== it.status || it.status === 'aguardando') return '';
  return '<span class="by s-' + it.status + '-txt">' + (it.status === 'aprovado' ? 'Aprovado' : 'Não aprovado') + ' por <b>' + esc(papel(e.por)) + '</b> · ' + quando(e.em) + '</span>';
}

function materialCell(it, inDrawer) {
  if (it.materialFromList) return '<div class="calc" data-calc="mat" data-id="' + it.id + '">' + money(it.materialTotal) + '<small>soma da lista</small></div>';
  return '<input class="in money-in" inputmode="decimal" placeholder="0,00" data-id="' + it.id + '" data-f="materialManual" value="' + moneyIn(it.materialManual) + '" aria-label="Valor do material"' + (inDrawer ? ' id="d-mat"' : '') + '>';
}

function listHTML() {
  if (!state.loaded) return '<div class="empty"><span class="spin"></span>Carregando serviços…</div>';
  var items = state.items.filter(function (it) { return state.filter === 'todos' || it.status === state.filter; });
  if (!state.items.length) return '<div class="empty"><svg class="big" aria-hidden="true"><use href="#elmo"/></svg><b>Nenhum serviço cadastrado</b><p>Toque em <strong>Novo serviço</strong>, grave um áudio contando o problema e tire uma foto. Nós sugerimos a solução e o prestador faz o orçamento.</p></div>';
  if (!items.length) return '<div class="empty"><b>Nada por aqui</b><p>Nenhum serviço com este status.</p></div>';

    var thumb = it.fotos.length ? '<img src="' + esc(photoSrc(it.fotos[0])) + '" alt="" loading="lazy">' : ICON.img;
    var flags = [];

        '<button class="svc" data-open="' + it.id + '"><span class="thumb">' + thumb + '</span><span class="os">' + osNum(it.numero) + '</span><span class="ttl">' + esc(it.titulo) + '</span>' +
          (it.descricao ? '<span class="desc">' + esc(it.descricao) + '</span>' : '') + (flags.length ? '<span class="flags">' + flags.join('') + '</span>' : '') + '</button>' +
        '<div class="card-status">' + statusControl(it) + quemAprovou(it) + '</div>' +
      '</div>' +
      '<div class="fields">' +
        '<label class="cell money"><span class="lbl">Mão de obra</span><input class="in" inputmode="decimal" placeholder="0,00" data-id="' + it.id + '" data-f="maoDeObra" value="' + moneyIn(it.maoDeObra) + '"></label>' +
        '<div class="cell money"><span class="lbl">Material</span>' + materialCell(it) + '</div>' +

        '<label class="cell money"><span class="lbl">Valor cobrado</span><input class="in" inputmode="decimal" placeholder="0,00" data-id="' + it.id + '" data-f="valorCobrado" value="' + cobradoIn(it.valorCobrado) + '"></label>' +
        '<div class="cell dif-cell"><span class="lbl">Diferença</span><span class="dif' + (it.temCobrado ? '' : ' zero') + '" data-calc="dif" data-id="' + it.id + '">' + difHTML(it) + '</span></div>' +
        '<label class="cell"><span class="lbl">Início <small class="opt">(opcional)</small></span><input class="in" type="date" data-id="' + it.id + '" data-f="inicio" value="' + esc(it.inicio) + '"></label>' +
        '<label class="cell"><span class="lbl">Término <small class="opt">(opcional)</small></span><input class="in" type="date" data-id="' + it.id + '" data-f="termino" value="' + esc(it.termino) + '"' + (it.inicio ? ' min="' + esc(it.inicio) + '"' : '') + '></label>' +
      '</div>' +
    '</article>';
  }).join('') + '</div>';
}

/* ---------- Registro de aprovações ---------- */
function logHTML() {
  var ev = [];
  state.items.forEach(function (it) { (it.historico || []).forEach(function (e) { ev.push({ e: e, it: it }); }); });
  ev.sort(function (a, b) { return String(b.e.em).localeCompare(String(a.e.em)); });
  var aprov = ev.filter(function (x) { return x.e.tipo === 'status'; });
  if (!aprov.length) return '<div class="empty"><b>Nenhuma aprovação registrada</b><p>Quando alguém aprovar, recusar ou voltar um serviço para aguardando, aparece aqui com o nome e a hora.</p></div>';
  return '<div class="log"><div class="log-head"><h2>Registro de aprovações</h2><span class="note">' + aprov.length + (aprov.length === 1 ? ' registro' : ' registros') + '</span></div>' +
    '<ul class="hist log-list">' + aprov.map(function (x) {
      return '<li>' + histLinha(x.e) + '<button class="log-os" data-open="' + x.it.id + '">' + osNum(x.it.numero) + ' · ' + esc(x.it.titulo) + '</button></li>';
    }).join('') + '</ul></div>';
}

/* ---------- Calendário ---------- */
function calHTML() {
  var y = state.month.getFullYear(), m = state.month.getMonth();
  var first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
  var start = addDays(first, -first.getDay()), end = addDays(last, 6 - last.getDay());
  var today = iso(new Date());
  var ranged = [], nodate = [];
  state.items.forEach(function (it) {
    var s = pd(it.inicio), e = pd(it.termino) || s;
    if (!s) { nodate.push(it); return; }
    if (e < s) { var t = s; s = e; e = t; }
    ranged.push({ it: it, s: s, e: e });
  });
  ranged.sort(function (a, b) { return a.s - b.s || (b.e - b.s) - (a.e - a.s); });
  var weeks = '';
  for (var ws = start; ws <= end; ws = addDays(ws, 7)) {
    var we = addDays(ws, 6), cells = '', bars = '', lanes = [];
    ranged.forEach(function (r) {
      if (r.e < ws || r.s > we) return;
      var c0 = Math.max(0, Math.round((r.s - ws) / 864e5)), c1 = Math.min(6, Math.round((r.e - ws) / 864e5));
      var lane = 0; while (lanes[lane] != null && lanes[lane] >= c0) lane++;
      lanes[lane] = c1;
      bars += '<button class="ev s-' + r.it.status + (r.s < ws ? ' cl' : '') + (r.e > we ? ' cr' : '') + '" data-open="' + r.it.id + '" style="grid-column:' + (c0 + 1) + ' / ' + (c1 + 2) + ';grid-row:' + (lane + 2) + '" title="' + esc(osNum(r.it.numero) + ' · ' + r.it.titulo + ' · ' + dm(r.it.inicio) + ' a ' + dm(r.it.termino || r.it.inicio)) + '">' + esc(r.it.titulo) + '</button>';
    });
    var nl = Math.max(2, lanes.length);
    for (var i = 0; i < 7; i++) {
      var d = addDays(ws, i);
      cells += '<div class="day' + (d.getMonth() !== m ? ' out' : '') + (iso(d) === today ? ' today' : '') + '" style="grid-column:' + (i + 1) + ';grid-row:1 / ' + (nl + 2) + '"><span>' + d.getDate() + '</span></div>';
    }
    weeks += '<div class="week" style="grid-template-rows:30px repeat(' + nl + ', var(--lane))">' + cells + bars + '</div>';
  }
  var title = state.month.toLocaleDateString('pt-BR', { month: 'long' }); title = title.charAt(0).toUpperCase() + title.slice(1) + ' ' + y;
  var html = '<div class="cal"><div class="cal-head"><h2>' + esc(title) + '</h2>' +
    '<button class="btn small" data-act="cal-today">Hoje</button>' +
    '<button class="btn small" data-act="cal-prev" aria-label="Mês anterior">' + ICON.left + '</button>' +
    '<button class="btn small" data-act="cal-next" aria-label="Próximo mês">' + ICON.right + '</button></div>' +
    '<div class="dow"><span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span></div>' + weeks +
    '<div class="legend">' + ['aprovado', 'aguardando', 'nao_aprovado'].map(function (s) { return '<span class="badge s-' + s + '">' + STATUS[s] + '</span>'; }).join('') + '</div></div>';
  if (nodate.length) html += '<div class="nodate"><h3>Sem data definida</h3><div class="chips">' + nodate.map(function (it) {
    return '<button class="badge s-' + it.status + '" data-open="' + it.id + '">' + osNum(it.numero) + ' · ' + esc(it.titulo) + '</button>';
  }).join('') + '</div></div>';
  return html;
}

/* ---------- Camada: ficha, modais ---------- */

  if (state.modal === 'new') html += '<div class="scrim modal-scrim" data-act="close-modal"></div><div class="modal" role="dialog" aria-modal="true" aria-label="Novo serviço">' + newHTML() + '</div>';
  if (state.modal === 'who') html += '<div class="scrim modal-scrim" data-act="close-modal"></div><div class="modal" role="dialog" aria-modal="true" aria-label="Quem é você">' + whoHTML() + '</div>';
  if (state.lightbox) html += '<div class="lightbox" data-act="close-lightbox"><img src="' + esc(state.lightbox) + '" alt="Foto ampliada"></div>';
  var layer = $('#layer');

  layer.innerHTML = html;
  var dr = layer.querySelector('.drawer'); if (dr) dr.scrollTop = scroll;

}

function mediaHTML(target, fotos, audios, itemId) {
  var h = '';
  if (fotos.length) h += '<div class="media">' + fotos.map(function (f, i) {
    return '<div class="ph"><img src="' + esc(photoSrc(f)) + '" alt="Foto ' + (i + 1) + '" data-act="lightbox" data-src="' + esc(photoSrc(f)) + '">' +
      '<button class="x" data-act="del-photo" data-target="' + target + '" data-idx="' + i + '" aria-label="Remover foto">' + ICON.x + '</button></div>';
  }).join('') + '</div>';
  audios.forEach(function (a, i) {
    var src = a.url || state.audioCache[a.id];

function updateCalcs() {
  state.items.forEach(function (it) {
    document.querySelectorAll('[data-calc][data-id="' + it.id + '"]').forEach(function (el) {
      var k = el.getAttribute('data-calc');
      if (k === 'total') { el.textContent = it.total ? money(it.total) : (el.closest('.bigtotal') ? money(0) : 'sem valor'); el.classList.toggle('zero', !it.total && !el.closest('.bigtotal')); }
      if (k === 'mat') el.firstChild.textContent = money(it.materialTotal);
      if (k === 'dif') { el.textContent = difHTML(it); el.classList.toggle('zero', !it.temCobrado && !el.closest('.bigdif')); el.classList.toggle('neg', it.temCobrado && it.diferenca < 0); }
      if (k === 'matsum') el.textContent = money((it.materiais || []).filter(function (m) { return m.usar && num(m.valor) > 0; }).reduce(function (a, m) { return a + num(m.valor); }, 0));
    });
  });
  renderSummary();
}

function saveField(id, f, raw, input) {
  var it = itemById(id); if (!it) return;
  var v = raw;
  if (f === 'maoDeObra' || f === 'materialManual') { v = num(raw); if (input) input.value = moneyIn(v); }
  if (f === 'valorCobrado') { v = String(raw).trim() === '' ? '' : num(raw); if (input) input.value = cobradoIn(v); }
  if (f === 'titulo' && !String(v).trim()) { if (input) input.value = it.titulo; return; }
  if (it[f] === v) return;
  it[f] = v; computeTotals(it); updateCalcs();
  var patch = {}; patch[f] = v;
  upd(id, 'update', [id, patch, actor()]);
  if (f === 'inicio' || f === 'termino' || f === 'titulo') state.dirty = true;
}

/* Envio ao servidor sem atropelar edições locais:
   a resposta só substitui o item quando não há outro envio dele em andamento,
   e a lista de materiais local é mantida enquanto houver mudança ainda não enviada. */
var inflight = {}, matTimers = {}, matVer = {}, matSent = {};
function upd(id, action, args) {
  inflight[id] = (inflight[id] || 0) + 1;
  return tracked(call.apply(null, [action].concat(args))).then(function (srv) {
    inflight[id]--; if (!inflight[id]) mergeServer(srv); return srv;
  }, function (e) { inflight[id]--; throw e; });
}
function touchMaterials(it) { matVer[it.id] = (matVer[it.id] || 0) + 1; }
function saveMaterials(it) {
  touchMaterials(it); computeTotals(it); updateCalcs();
  clearTimeout(matTimers[it.id]);
  matTimers[it.id] = setTimeout(function () {
    matTimers[it.id] = null;
    var v = matVer[it.id];
    var list = it.materiais.filter(function (m) { return m.nome || m.qtd || num(m.valor); });
    upd(it.id, 'update', [it.id, { materiais: list }, actor()]).then(function () { matSent[it.id] = v; }, function () {});
    matSent[it.id] = v;
  }, 500);
}
function flushAll() {
  var a = document.activeElement;
  if (a && a.blur && /^(INPUT|TEXTAREA)$/.test(a.tagName)) a.blur();
  Object.keys(matTimers).forEach(function (id) {
    if (!matTimers[id]) return;
    clearTimeout(matTimers[id]); matTimers[id] = null;
    var it = itemById(id); if (!it) return;
    var v = matVer[id];
    upd(id, 'update', [id, { materiais: it.materiais.filter(function (m) { return m.nome || m.qtd || num(m.valor); }) }, actor()]).then(function () { matSent[id] = v; }, function () {});
    matSent[id] = v;
  });
}
function saveAndClose() {
  if (state.closing) return;
  flushAll();
  state.closing = true; renderLayer();
  var t0 = Date.now(), failed = false;
  var before = toastTimer;
  (function wait() {
    setTimeout(function () {
      if (state.pending > 0 && Date.now() - t0 < 20000) return wait();
      state.closing = false;
      if (state.pending > 0) { toast('Ainda salvando. Aguarde um instante e tente de novo.'); renderLayer(); return; }
      state.openId = null; render(); toast('Alterações salvas.');
    }, 150);
  })();
}
function mergeServer(srv) {
  if (!srv) return;
  var cur = itemById(srv.id);
  if (cur) {
    var unsent = matTimers[srv.id] || (matVer[srv.id] || 0) !== (matSent[srv.id] || 0);
    if (unsent) srv.materiais = cur.materiais;
    else srv.materiais = (srv.materiais || []).concat((cur.materiais || []).filter(function (m) { return !m.nome && !m.qtd && !num(m.valor); }));
    if (cur.materialFromList !== computeTotals(srv).materialFromList) state.dirty = true;
  }
  setItem(srv);
  render();
}

function setStatus(id, s) {
  var it = itemById(id); if (!it || it.status === s) return;
  if (!eu()) { state.pendingStatus = { id: id, s: s }; state.modal = 'who'; renderLayer(); return; }
  var prev = it.status, por = eu();
  it.status = s;
  it.historico = (it.historico || []).concat([{ tipo: 'status', de: prev, para: s, por: por, em: new Date().toISOString() }]);
  render();
  upd(id, 'setStatus', [id, s, por]).then(function () { toast((ACAO[s] || s) + ' por ' + por + '.'); }).catch(function () {
    it.status = prev; it.historico = it.historico.slice(0, -1); render();
  });
}
function salvarNome(n) {
  n = String(n || '').trim().slice(0, 40);
  if (!n) { toast('Escolha ou digite um nome.'); return; }
  LS.set('obra.eu', n); LS.set('obra.who', n);
  var p = state.pendingStatus; state.pendingStatus = null; state.modal = null;
  render();
  if (p) setStatus(p.id, p.s); else toast('Aprovações deste aparelho ficam em nome de ' + n + '.');
}

function requestSuggestion(id) {
  state.sugBusy[id] = true; delete state.sugErr[id]; state.confirmSug = false; render();
  call('suggest', id).then(function (srv) { delete state.sugBusy[id]; setItem(srv); render(); })
    .catch(function (e) { delete state.sugBusy[id]; state.sugErr[id] = e.message; var it = itemById(id); if (it) it.sugestaoStatus = 'erro'; render(); });
}

function papelInicial() {
  var ok = [CONFIG.DONO, CONFIG.PRESTADOR];
  var a = papel(LS.get('obra.who')), b = papel(eu());
  return ok.indexOf(a) >= 0 ? a : ok.indexOf(b) >= 0 ? b : CONFIG.DONO;
}
function newDraft() { return { titulo: '', descricao: '', fotos: [], audios: [], criadoPor: papelInicial(), saving: false }; }
function readDraftInputs() {
  if (!state.draft) return;
  var t = $('#n-titulo'), d = $('#n-desc');
  if (t) state.draft.titulo = t.value; if (d) state.draft.descricao = d.value;
}
function createService() {
  readDraftInputs();
  var d = state.draft;
  if (!d.titulo.trim() && !d.descricao.trim() && !d.audios.length && !d.fotos.length) {
    toast('Grave um áudio, anexe uma foto ou escreva o que precisa ser feito.'); return;
  }
  if (!d.titulo.trim() && !(state.hasClaude && state.autoSuggest)) { toast('Escreva um título para o serviço.'); var t = $('#n-titulo'); if (t) t.focus(); return; }
  d.saving = true; d.step = 'Enviando o serviço…'; renderLayer();
  LS.set('obra.who', d.criadoPor);

      it.sugestao = {
        demo: true,
        diagnostico: 'Na versão real, aqui aparece um diagnóstico curto de "' + it.titulo + '": causa provável e o que conferir antes de começar.',
        passos: [
          { titulo: 'Avaliar no local', detalhe: 'Conferir o problema, medir a área e confirmar a causa.' },
          { titulo: 'Preparar e proteger', detalhe: 'Isolar a área, proteger piso e móveis e separar ferramentas.' },
          { titulo: 'Executar o serviço', detalhe: 'Os passos detalhados aparecem aqui, na ordem de execução.' },
          { titulo: 'Limpar e entregar', detalhe: 'Retirar entulho, limpar e mostrar o resultado ao proprietário.' }
        ],
        cuidados: ['Os cuidados de segurança e as normas aplicáveis aparecem aqui.'], prazoDias: 3
      };
      it.sugestaoStatus = 'ok';
      [['Material sugerido 1', '—'], ['Material sugerido 2', '—'], ['Material sugerido 3', '—']].forEach(function (m) {
        it.materiais.push({ id: uid(), nome: m[0], qtd: m[1], obs: '', usar: false, valor: 0, sugerido: true });
      });
      computeTotals(it); return clone(it);
    }
  };
  seed();
  return {
    call: function (action, args) {
      return wait(action === 'suggest' ? 1800 : 200).then(function () {
        try { return routes[action].apply(null, args); } catch (e) { return Promise.reject(e); }
      });
    }
  };
})();

/* ===================== Início ===================== */
$('#projName').textContent = CONFIG.PROJETO;
render();
load();
</script>
